name: docs-notebooks

# Executes the tutorial notebooks and commits the rendered (output-included)
# copies into docs/tutorials/. This runs on a regular GitHub Actions runner
# rather than on ReadTheDocs itself, since RTD's build containers don't have
# enough memory to run the BDM/CTF decoding notebooks -- see the OOM this
# workflow replaced. tutorials/*.ipynb (the canonical, output-free source)
# is only ever read here, never written to.
on:
  push:
    branches: [master]
    paths:
      - 'tutorials/*.ipynb'
      - 'docs/conf.py'
      - 'open_dvm/**'  # package changes can change what the notebooks render/print
  workflow_dispatch: {}

# Notebook execution takes ~20 min; a second push landing on master while
# this is in flight used to make the final push fail as non-fast-forward
# (happened twice). Queue runs on the same ref instead of letting them
# race each other -- this only guards workflow-vs-workflow races, the
# retry-with-rebase logic below handles workflow-vs-manual-push races.
concurrency:
  group: docs-notebooks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # master requires PRs for the default GITHUB_TOKEN's bot identity,
          # but admin pushes bypass that -- authenticate as the repo owner
          # via a PAT so this workflow's commit can push directly, same as
          # a manual push would.
          token: ${{ secrets.DOCS_BOT_PAT }}
          # Full history, not the default shallow clone -- the commit/push
          # step below rebases onto whatever master has moved to by the
          # time the ~20 min notebook execution finishes, which needs a
          # real common ancestor to work with.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install open_dvm and notebook execution tools
        run: |
          pip install -e .
          pip install jupyter nbconvert ipykernel

      - name: Execute tutorial notebooks
        # Notebook 01 (preprocessing) needs interactive ICA component
        # selection and can't run headless -- excluded, same as the docs
        # toctree (see docs/tutorials/index.md).
        run: |
          for nb in 00_visualization_and_statistics 02_erp_analysis 03_tfr_analysis \
                    04_tfr_advanced 05_bdm_decoding 06_bdm_advanced 07_ctf_analysis \
                    08_ctf_advanced 09_bdm_ctf_comparison; do
            cp "tutorials/${nb}.ipynb" "/tmp/${nb}.ipynb"
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=1200 \
              "/tmp/${nb}.ipynb"
            mv "/tmp/${nb}.ipynb" "docs/tutorials/${nb}.ipynb"
          done

      - name: Coalesce fragmented stream output
        # Many small print()/logging calls in one cell each land as their
        # own output entry in the notebook JSON; MyST-NB renders every
        # entry as its own boxed block, which reads as dozens of stray
        # "cells". nbconvert's own exporters merge these by default --
        # MyST-NB doesn't, so do it explicitly before committing.
        run: |
          python -c "
          import nbformat, glob
          from nbconvert.preprocessors import CoalesceStreamsPreprocessor
          pre = CoalesceStreamsPreprocessor()
          for path in glob.glob('docs/tutorials/*.ipynb'):
              nb = nbformat.read(path, as_version=4)
              nb, _ = pre.preprocess(nb, {})
              nbformat.write(nb, path)
          "

      - name: Commit and push rendered notebooks
        # Not stefanzweifel/git-auto-commit-action here -- it pushes once
        # and gives up, which fails as non-fast-forward if master moved
        # during the ~20 min notebook execution (observed twice: another
        # docs-notebooks run finishing first, and a manual push landing
        # mid-run). Rebase onto the latest master immediately before every
        # push attempt instead of just once.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docs/tutorials/*.ipynb; then
            echo "No notebook output changes to commit."
            exit 0
          fi

          git add docs/tutorials/*.ipynb
          git commit -m "docs: re-execute tutorial notebooks"

          for attempt in 1 2 3 4 5; do
            git fetch origin master
            if ! git rebase origin/master; then
              echo "Rebase conflict against latest master -- needs human review."
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:master; then
              echo "Pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying..."
          done

          echo "Failed to push after 5 attempts."
          exit 1
